[project]
name = "obsidian-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.9,<3.15"
dependencies = [
    # eMudhra中間CA鍵漏えい(2026-10)対応: 該当CAを除外したCAバンドルを必須にする
    "certifi>=2026.10.19",
    "feedparser>=6.0.12",
    "google-cloud-aiplatform[adk,agent-engines]>=1.112",
    "google-genai>=2.0.0",
    "langfuse>=4.0.6",
    "pyyaml>=6.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.0.0",
    "pandas>=3.0.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "rouge-score>=0.1.2",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
asyncio_mode = "auto"
addopts = "-m 'not llm_eval'"
# Python 3.14 + google-genai の既知警告（上流対応待ち）をピンポイントで抑制
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types",
]
markers = [
    "llm_eval: LLMを実際に呼び出す評価テスト（明示的に -m llm_eval で実行）",
]

[tool.uv]
exclude-newer = "7 days"
# 緊急のセキュリティ修正は猶予なしで取り込む（eMudhra中間CA鍵漏えい対応）
exclude-newer-package = { certifi = false }

