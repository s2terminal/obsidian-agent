services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: development
    env_file:
      - .env
    environment:
      FEED_MD: /data/feed.md
      OBSIDIAN_ROOT: /vault
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ${FEED_MD}
        target: /data/feed.md
      - type: bind
        source: ${OBSIDIAN_ROOT}
        target: /vault
      - type: volume
        source: reader-cache
        target: /app/scripts/reader/.cache

volumes:
  reader-cache:
